version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT}:9001"   # Console
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/conformed &&
      mc mb --ignore-existing local/raw &&
      mc mb --ignore-existing local/curated &&
      mc ls local &&
      echo 'MinIO buckets initialised'
      "
    restart: "no"

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${AIRFLOW_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${AIRFLOW_POSTGRES_DB}"
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-user-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: apache/airflow:2.10.3-custom
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"

      S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"

      AIRFLOW_UID: "${AIRFLOW_UID}"
      PIP_ADDITIONAL_REQUIREMENTS: "${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS}"
      AIRFLOW_VAR_ASX_TICKERS: "${AIRFLOW_VAR_ASX_TICKERS}"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
    entrypoint: /bin/bash
    command: >
      -lc "
      airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USERNAME} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true
      "
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: apache/airflow:2.10.3-custom
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      airflow-user-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"

      # MinIO / S3-compatible defaults for DAG code
      S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"

      # Optional permissions helper (Linux/WSL; harmless elsewhere)
      AIRFLOW_UID: "${AIRFLOW_UID}"

      # Install DAG dependencies at container start (no Dockerfile)
      PIP_ADDITIONAL_REQUIREMENTS: "${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS}"

      # Airflow Variable override via env (no UI)
      AIRFLOW_VAR_ASX_TICKERS: "${AIRFLOW_VAR_ASX_TICKERS}"

    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
    command: airflow webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: apache/airflow:2.10.3-custom
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-user-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"

      S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"

      AIRFLOW_UID: "${AIRFLOW_UID}"
      PIP_ADDITIONAL_REQUIREMENTS: "${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS}"
      AIRFLOW_VAR_ASX_TICKERS: "${AIRFLOW_VAR_ASX_TICKERS}"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data
    command: airflow scheduler
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    image: jupyter/minimal-notebook:custom
    ports:
      - "${JUPYTER_PORT}:8888"
    environment:
      JUPYTER_TOKEN: "${JUPYTER_TOKEN}"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./config:/home/jovyan/config:ro
      - ./data:/home/jovyan/data
    restart: "no"

  php:
    image: dunglas/frankenphp:latest
    ports:
      - "${PHP_PORT}:80"
    volumes:
      # Put your live-edit PHP files here (e.g., ./php/index.php)
      - ./php:/app/public
      - ./data:/app/data:ro
    environment:
      SERVER_NAME: ":80"
      TZ: "${TZ}"
    restart: unless-stopped

volumes:
  minio-data:
  airflow-postgres-data:
